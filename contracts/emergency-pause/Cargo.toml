[package]
name = "emergency-pause"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
relay-registry = { path = "../relay-registry", features = ["testutils"] }
fee-distributor = { path = "../fee-distributor", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
